name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install GEOS, which the geometry kernel loads
        run: sudo apt-get update && sudo apt-get install -y libgeos-dev
      - name: Install the constitutive model, and the geometry kernel and shell FE for the tests
        # not on PyPI yet: install them from their repositories
        run: |
          pip install "laminate-constitutive-model @ git+https://github.com/samhughes-fea/laminate-constitutive-model@v0.3.0"
          pip install "implicit-geometry-kernel @ git+https://github.com/samhughes-fea/implicit-geometry-kernel@K9"
          pip install --no-deps "shell-fem @ git+https://github.com/samhughes-fea/shell-fem@v0.2.0"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Build sdist and wheel
        run: python -m build
