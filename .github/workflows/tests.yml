name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the geometry kernel and the laminate model
        # not on PyPI yet: install them from their repositories
        run: |
          pip install "implicit-geometry-kernel @ git+https://github.com/samhughes-fea/implicit-geometry-kernel@59adf17bb613e75d53192eb64a4ecbcb96acde4c"
          pip install "composite-laminate-model @ git+https://github.com/samhughes-fea/composite-laminate-model"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Build sdist and wheel
        run: python -m build
