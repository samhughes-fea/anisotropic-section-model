# Synced from the shared development standard 0.1.0. Edit it there, not here.
name: release

# Makes a release: the vX.Y.Z tag, the GitHub release with the sdist and wheel
# and their build provenance, and (when .github/repo.yml says `pypi: true` and a
# PyPI trusted publisher is set up for environment "pypi") the PyPI upload.
# Rules: docs/conventions/standard/releasing.md. Values read from
# .github/repo.yml at the release commit: `package`, `version-line`, `stable`,
# `pypi`.
#
# Three ways in:
# - push to main: when a commit in the push is a merged release PR
#   ("chore(release): prepare X.Y.Z", as a squash subject or as the PR title in
#   a merge commit), this workflow creates the tag itself. Any other push to
#   main stops after the first job.
# - workflow_dispatch with a commit SHA: releases a release commit that was not
#   tagged when it landed, or finishes a release whose tag exists on that
#   commit but whose GitHub release or PyPI upload failed.
# - push of a v* tag made by hand: checked and released.
#
# A tag created here with GITHUB_TOKEN does not start another workflow run, so
# this run does the build and release itself instead of waiting for a tag push.
# A tag is never moved or remade: a push to main whose tag already exists stops
# without changing anything, and a tag on a different commit fails the run.
#
# Concurrency is per tag and per job, not for the whole workflow: GitHub keeps
# only one pending run in a concurrency group, so a workflow-wide group could
# let a later push to main cancel a release run that was still waiting.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit on main to release (the release PR's commit)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    # Decides whether this run makes a release, which tag and which commit, and
    # checks the tag rules against that commit.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.check.outputs.release }}
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.check.outputs.sha }}
      create_tag: ${{ steps.check.outputs.create_tag }}
      pypi: ${{ steps.check.outputs.pypi }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the release rules
        id: check
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_SHA: ${{ inputs.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          skip() { echo "::notice::$1"; echo "release=false" >> "$GITHUB_OUTPUT"; exit 0; }

          git fetch --tags --force origin
          git fetch origin main

          release_re='^chore\(release\)!?: prepare v?[0-9]'
          # The PR title of a commit: the subject of a squash merge, or the first
          # non-blank body line of a "Merge pull request #N from ..." commit.
          title_of() {
            local subject body line
            subject=$(git log -1 --format=%s "$1")
            if [[ "$subject" =~ ^Merge\ pull\ request\ \#[0-9]+ ]]; then
              body=$(git log -1 --format=%b "$1")
              while IFS= read -r line; do
                if [ -n "${line//[[:space:]]/}" ]; then printf '%s' "$line"; return; fi
              done <<< "$body"
            fi
            printf '%s' "$subject"
          }

          # The commit to release, and whether this run creates the tag.
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            sha="$GITHUB_SHA"; create_tag=false
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            sha=$(git rev-parse --verify "${INPUT_SHA}^{commit}") || fail "${INPUT_SHA} is not a commit"
            create_tag=true
          else
            # Every commit the push added to main's first-parent line, not only
            # the head: a push can carry more than one merged PR.
            if [ -n "${BEFORE//0/}" ] && git merge-base --is-ancestor "$BEFORE" "$GITHUB_SHA" 2>/dev/null; then
              range=$(git rev-list --first-parent "${BEFORE}..${GITHUB_SHA}")
            else
              range="$GITHUB_SHA"
            fi
            found=()
            for c in $range; do
              if grep -Eq "$release_re" <<< "$(title_of "$c")"; then found+=("$c"); fi
            done
            [ "${#found[@]}" -eq 0 ] && skip "no release PR merge in this push; nothing to release"
            [ "${#found[@]}" -gt 1 ] && fail "this push merges ${#found[@]} release PRs (${found[*]}); run the workflow by hand on each, oldest first"
            sha="${found[0]}"; create_tag=true
          fi

          git merge-base --is-ancestor "$sha" origin/main || fail "$sha is not on main"

          # This repository's values at that commit.
          git show "$sha:.github/repo.yml" > "$RUNNER_TEMP/repo.yml" || fail ".github/repo.yml is missing at ${sha}"
          package=$(yq -r '.package // ""' "$RUNNER_TEMP/repo.yml")
          line=$(yq -r '."version-line" // ""' "$RUNNER_TEMP/repo.yml")
          stable=$(yq -r '.stable // false' "$RUNNER_TEMP/repo.yml")
          pypi=$(yq -r '.pypi // false' "$RUNNER_TEMP/repo.yml")
          [ -n "$package" ] || fail ".github/repo.yml has no 'package'"

          # __version__ at that commit.
          version=$(git show "$sha:src/${package}/__init__.py" | python3 -c "import ast, sys; tree = ast.parse(sys.stdin.read()); print(next(n.value.value for n in tree.body if isinstance(n, ast.Assign) and any(getattr(t, 'id', '') == '__version__' for t in n.targets)))")
          tag="v${version}"
          echo "commit ${sha}, __version__ ${version}"

          if [ "$create_tag" = "true" ]; then
            # Only a merged release PR is released. PRs are squash-merged on
            # their title, so the commit subject is the release PR's title.
            subject=$(title_of "$sha")
            grep -Eq "$release_re" <<< "$subject" || fail "$sha is not a release PR merge (title: ${subject})"
            named=$(echo "$subject" | sed -E 's/^chore\(release\)!?: prepare v?([0-9][0-9A-Za-z.]*).*/\1/')
            test "$named" = "$version" || fail "release PR names ${named} but __version__ is ${version}"
          else
            test "$REF_NAME" = "$tag" || fail "tag ${REF_NAME} does not match __version__ ${version}"
          fi

          # The tag form, the version line, and no 1.0.0 until the repository
          # says `stable: true` (a maintainer decision).
          grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$' <<< "$tag" || fail "${tag} is not a release tag (vX.Y.Z or vX.Y.ZrcN)"
          if [ -n "$line" ]; then
            grep -Eq "^v${line//./\\.}\.[0-9]+(rc[0-9]+)?$" <<< "$tag" || fail "${tag} is outside this repository's version line ${line}.x"
          fi
          major="${version%%.*}"
          if [ "$major" -ge 1 ] && [ "$stable" != "true" ]; then
            fail "${tag}: this repository is pre-1.0; going to 1.0.0 needs 'stable: true' in .github/repo.yml"
          fi

          # An existing tag is never moved or remade.
          if [ "$create_tag" = "true" ] && git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            at=$(git rev-parse "${tag}^{commit}")
            [ "$at" = "$sha" ] || fail "${tag} already exists on ${at}, not on ${sha}; tags never move, so release the next patch version"
            [ "$EVENT" = "workflow_dispatch" ] || skip "${tag} already exists on ${sha}; nothing to do"
            echo "::notice::${tag} already exists on ${sha}; finishing its release without touching the tag"
            create_tag=false
          fi

          # The changelog at that commit has the release heading; a release
          # (not a candidate) has its date: "## [X.Y.Z] - YYYY-MM-DD" (the
          # brackets are optional). It is CHANGELOG.md, or docs/CHANGELOG.md.
          v="${version%%rc*}"
          ve="${v//./\\.}"
          git show "$sha:CHANGELOG.md" > "$RUNNER_TEMP/CHANGELOG.md" 2>/dev/null \
            || git show "$sha:docs/CHANGELOG.md" > "$RUNNER_TEMP/CHANGELOG.md" \
            || fail "no CHANGELOG.md or docs/CHANGELOG.md at ${sha}"
          grep -Eq "^## \\[?${ve}\\]?( |$)" "$RUNNER_TEMP/CHANGELOG.md" || fail "the changelog has no '## [${v}]' heading"
          if [ "$v" = "$version" ]; then
            grep -Eq "^## \\[?${ve}\\]? - [0-9]{4}-[0-9]{2}-[0-9]{2}" "$RUNNER_TEMP/CHANGELOG.md" || fail "the changelog heading for ${v} has no date; the release PR sets '## [${v}] - YYYY-MM-DD'"
          fi

          {
            echo "release=true"
            echo "tag=${tag}"
            echo "sha=${sha}"
            echo "create_tag=${create_tag}"
            echo "pypi=${pypi}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::releasing ${tag} from ${sha} (create tag: ${create_tag}, PyPI: ${pypi})"

  build:
    needs: resolve
    if: ${{ needs.resolve.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # The release commit is checked out only after this job confirms it is on
      # main (protected), so no code from outside main is built or run here.
      - name: Check out the release commit
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${SHA}" origin/main || { echo "::error::${SHA} is not on main"; exit 1; }
          git checkout --detach "${SHA}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Attest build provenance
        # Free on public repositories only.
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  tag:
    # Creates the annotated tag on the release commit, after the build passed.
    needs: [resolve, build]
    if: ${{ needs.resolve.outputs.create_tag == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Per tag, so only runs for the same release wait on each other.
    concurrency:
      group: release-tag-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create and push the tag
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::${TAG} appeared while this run was building; not touching it"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "${REPO} ${TAG#v}" "${SHA}"
          git push origin "refs/tags/${TAG}"

  publish:
    needs: [resolve, build, tag]
    # Runs after the tag job, or when the tag was pushed by hand (tag skipped).
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.tag.result == 'success' || needs.tag.result == 'skipped') && needs.resolve.outputs.pypi == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    concurrency:
      group: release-pypi-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # A dispatch that finishes a failed release may find the files there.
          skip-existing: true

  github-release:
    # The GitHub release for the tag: notes are the tag's CHANGELOG.md section,
    # with the sdist and wheel attached. A release candidate is a pre-release.
    needs: [resolve, build, tag]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-notes-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # The release commit is checked out only after this job confirms it is on
      # main (protected), so no code from outside main is built or run here.
      - name: Check out the release commit
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${SHA}" origin/main || { echo "::error::${SHA} is not on main"; exit 1; }
          git checkout --detach "${SHA}"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Notes from the changelog
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          v="${TAG#v}"; v="${v%%rc*}"
          log=CHANGELOG.md; [ -f "$log" ] || log=docs/CHANGELOG.md
          awk -v v="$v" '
            BEGIN {gsub(/\./, "\\.", v)}
            $0 ~ "^## \\[?" v "\\]?( |$)" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' "$log" > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          body_path: notes.md
          files: dist/*
          prerelease: ${{ contains(needs.resolve.outputs.tag, 'rc') }}
          make_latest: ${{ !contains(needs.resolve.outputs.tag, 'rc') }}
