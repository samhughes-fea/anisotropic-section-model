# Synced from the shared development standard 0.1.1. Edit it there, not here.
name: Decision request
description: A choice the maintainer needs to make
labels: [needs-decision]
body:
  - type: textarea
    id: question
    attributes:
      label: The question
      description: One question, in a sentence.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options
      description: Two to four options, each with what follows from it.
    validations:
      required: true
  - type: textarea
    id: recommendation
    attributes:
      label: Recommendation and why
  - type: markdown
    attributes:
      value: |
        Once decided, the maintainer removes `needs-decision`, and a lasting
        choice gets a record in docs/decisions/ that links this issue.
