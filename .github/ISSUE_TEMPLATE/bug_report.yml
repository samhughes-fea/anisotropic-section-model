# Synced from the shared development standard 0.1.0. Edit it there, not here.
name: Bug report
description: Wrong results, a crash, or a failed check
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not attach confidential data. A public or made-up input that
        shows the same problem is ideal.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected and what you got (error text, wrong number, figure).
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Smallest script that shows it
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The package's __version__, or the commit you installed.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Python and OS
      placeholder: "3.12, Ubuntu 24.04"
